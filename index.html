<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>宝贝，中秋节快乐 💗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    height: 100%;
    overflow: hidden;
    background: #04060f;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    /* 夜空渐变 + 星空由 JS 生成静态图放进 CSS 背景（GPU 合成，不占 canvas 帧绘制） */
    background-color: #04060f;
    background-image: radial-gradient(ellipse at 50% 42%, #1a1633 0%, #0a0c1c 45%, #04060f 100%);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
  }
  canvas {
    position: fixed; inset: 0; display: block;
    /* 透明画布：静态夜景由 body 背景透出，canvas 只画动态元素 */
    background: transparent;
  }

  /* ================= 开场遮罩 ================= */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 16px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(ellipse at 50% 42%, rgba(30,38,70,.10), rgba(3,5,12,.55) 70%);
    transition: opacity 1.4s ease, visibility 1.4s;
  }
  #intro.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  #intro .badge {
    font-size: clamp(12px, 3vw, 14px);
    letter-spacing: 8px;
    color: #ffeec2;
    animation: rise 1.2s .2s ease both;
  }
  #intro h1 {
    margin-top: 18px;
    font-size: clamp(28px, 7vw, 58px);
    font-weight: 800;
    letter-spacing: 4px;
    color: #fff6e2;
    text-shadow: 0 0 24px rgba(255,220,150,.75), 0 0 60px rgba(255,190,120,.35);
    animation: rise 1.2s .55s ease both;
  }
  #intro .sub {
    margin-top: 16px;
    font-size: clamp(13px, 3.2vw, 20px);
    letter-spacing: 3px;
    color: rgba(235,240,255,.82);
    animation: rise 1.2s .95s ease both;
  }
  #enter-btn {
    margin-top: 48px;
    padding: 14px 42px;
    font-size: clamp(14px, 3.4vw, 19px);
    font-family: inherit;
    letter-spacing: 3px;
    color: #5a1530;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(180deg, #ffe9b0, #ffc46b 55%, #ff9d6c);
    box-shadow: 0 0 26px rgba(255,190,110,.65), 0 6px 0 #b86a3a;
    animation: rise 1.2s 1.35s ease both, breathe 2.2s 2.6s ease-in-out infinite;
    transition: transform .1s;
    -webkit-appearance: none;
  }
  #enter-btn:active { transform: translateY(4px); box-shadow: 0 0 26px rgba(255,190,110,.65), 0 2px 0 #b86a3a; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* ================= 爱心宇宙文案 ================= */
  #lines {
    position: fixed;
    left: 0; right: 0;
    bottom: max(9%, env(safe-area-inset-bottom));
    z-index: 5;
    text-align: center;
    pointer-events: none;
    padding: 0 12px;
  }
  #lines p {
    font-size: clamp(15px, 4vw, 26px);
    letter-spacing: 4px;
    color: #ffe8f1;
    text-shadow: 0 0 18px rgba(255,120,170,.75);
    margin: 8px 0;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 1.4s ease, transform 1.4s ease;
  }
  #lines p.show { opacity: 1; transform: translateY(0); }
  #lines .sign {
    margin-top: 18px;
    font-size: clamp(12px, 3vw, 17px);
    letter-spacing: 3px;
    color: #ffd2a0;
    text-shadow: 0 0 14px rgba(255,190,110,.6);
  }
  #tap-hint {
    position: fixed;
    top: max(64px, env(safe-area-inset-top));
    width: 100%;
    z-index: 5;
    text-align: center;
    font-size: 13px;
    letter-spacing: 3px;
    color: rgba(255,255,255,.55);
    opacity: 0;
    transition: opacity 2s ease;
    pointer-events: none;
  }
  #tap-hint.show { opacity: 1; }

  /* ================= 音乐控制 ================= */
  #music-bar {
    position: fixed;
    right: max(14px, env(safe-area-inset-right));
    top: max(14px, env(safe-area-inset-top));
    z-index: 20;
    display: flex;
    gap: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #music-bar.show { opacity: 1; pointer-events: auto; }
  #music-bar button {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,220,150,.45);
    background: rgba(22,18,42,.55);
    color: #ffe9b0;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-shadow: 0 0 14px rgba(255,190,110,.25);
    transition: transform .1s, background .2s;
    -webkit-appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #music-bar button:active { transform: scale(.9); }
  @media (max-width: 600px) {
    #music-bar button { width: 36px; height: 36px; font-size: 14px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<audio id="bgm" preload="auto"></audio>
<div id="music-bar">
  <button id="btn-mute" title="音乐开关">🔊</button>
  <button id="btn-prev" title="上一首">⏮</button>
  <button id="btn-next" title="下一首">⏭</button>
  <button id="btn-pick" title="选择本设备里的音乐">🎵</button>
  <input type="file" id="file-music" accept="audio/*" hidden>
</div>

<div id="intro">
  <div class="badge">中 · 秋 · 佳 · 节</div>
  <h1 id="title">中秋节快乐</h1>
  <div class="sub" id="subtitle">露华浸液,嘉谊长存</div>
  <button id="enter-btn">点击奔赴中秋爱心宇宙 💗</button>
</div>

<div id="tap-hint">轻触屏幕，为你绽放烟花 ✨</div>
<div id="lines"></div>

<script>
/* =====================================================================
   ✦✦✦  定制区：只需要改下面这个 CONFIG，不用动其他代码  ✦✦✦
   title / subtitle：开场大字和小字
   lines：进入爱心宇宙后逐句浮现的话（想加几句就加几句）
   sign：落款
   heartHue：爱心主色调（0红 / 320玫红 / 280紫 / 200蓝）
===================================================================== */
const CONFIG = {
  title: '中秋节快乐',
  subtitle: '露华浸液,嘉谊长存',
  button: '点击奔赴中秋爱心宇宙 💗',
  lines: [
    "中秋、月圆、家暖",
    "愿秋风不扰，岁月安然",
    "愿爱与好运，都如期而至🥮",
  ],
  sign: '—— fsy',
  heartHue: 345,

  /* —— 背景音乐（可存多首） ——
     把音乐文件和本网页放在同一个文件夹，文件名逐个写进 playlist：
       playlist: ['歌1.mp3', '歌2.mp3', '歌3.mp3']
     会按顺序循环播放，某首缺失时自动跳下一首；
     部署时把音乐和网页一起上传，分享出去的链接就能听。
     进入页面后也可点右上角 ⏮ ⏭ 切歌、🎵 临时选本设备的音乐。 */
  playlist: [
    'bgm.mp3',
    'bgm2.mp3',
    'bgm3.mp3',
    // ,'第二首.mp3'    ← 想多存几首：去掉行首 // 并改成你的文件名（注意保留逗号）
  ],
  bgmVolume: 0.55,      // 音量 0 ~ 1

  /* —— 桂花飘落（桌面端数量，手机端会按画质自动减少）—— */
  osmanthusCount: 56    // 桂花数量，填 0 可关闭
};

(() => {
  'use strict';

  // 把定制文案写进页面
  document.title = CONFIG.title + ' 💗';
  document.getElementById('title').textContent = CONFIG.title;
  document.getElementById('subtitle').textContent = CONFIG.subtitle;
  document.getElementById('enter-btn').textContent = CONFIG.button;
  const linesBox = document.getElementById('lines');
  CONFIG.lines.forEach(t => {
    const p = document.createElement('p');
    p.textContent = t;
    linesBox.appendChild(p);
  });
  const signEl = document.createElement('p');
  signEl.className = 'sign';
  signEl.textContent = CONFIG.sign;
  linesBox.appendChild(signEl);

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d'); // 透明画布：静态夜空交给 CSS 背景

  // ==================== 设备检测与画质分档（手机流畅优先） ====================
  const UA = navigator.userAgent;
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(UA)
    || (navigator.maxTouchPoints > 1 && Math.min(window.innerWidth, window.innerHeight) < 820);
  const isWXAndroid = /MicroMessenger/i.test(UA) && /Android/i.test(UA); // 微信安卓内核：canvas 偏弱，直接低档
  const cores = navigator.hardwareConcurrency || 4;
  const mem = navigator.deviceMemory || 4;
  // tier: 0=桌面高档  1=手机中档  2=低端/微信安卓省电档
  let tier = isMobile ? (isWXAndroid || cores <= 4 || mem <= 4 ? 2 : 1) : 0;

  // 各档画质参数（粒子数、绘制开关集中管理）
  // scale：画布内部渲染缩放（<1 时画面轻微变软，但填充率开销按平方下降）
  // fpsCap：0=不限；30=锁定约 30fps（稳定 30 帧比抖动的 40 帧观感更流畅）
  const TIERS = [
    { dprCap: 2,   scale: 1,    fpsCap: 0,  edge: 820, fill: 2300, petalMul: 1.0, fwMin: 60, fwMax: 100, hfw: 90, maxLamp: 12, starDiv: 6500,  twinkle: true,  wobble: true,  dust: 14, fwCap: 1600, fwAutoMin: 1.4, fwAutoMax: 3.6, glowScale: 1.0 },
    { dprCap: 1.5, scale: .92,  fpsCap: 0,  edge: 240, fill: 560,  petalMul: .4,  fwMin: 22, fwMax: 38,  hfw: 40, maxLamp: 6,  starDiv: 9000,  twinkle: true,  wobble: false, dust: 5,  fwCap: 550,  fwAutoMin: 2.2, fwAutoMax: 4.2, glowScale: .92 },
    { dprCap: 1,   scale: .8,   fpsCap: 30, edge: 140, fill: 300,  petalMul: .18, fwMin: 12, fwMax: 20,  hfw: 22, maxLamp: 3,  starDiv: 13000, twinkle: false, wobble: false, dust: 0,  fwCap: 320,  fwAutoMin: 3.0, fwAutoMax: 5.5, glowScale: .82 }
  ];
  const Q = () => TIERS[tier];

  let W = 0, H = 0, CX = 0, CY = 0, S = 1;
  const mouse = { x: -9999, y: -9999 };
  let entered = false;

  // ---------- 背景音乐（播放列表） ----------
  const bgm = document.getElementById('bgm');
  const musicBar = document.getElementById('music-bar');
  const btnMute = document.getElementById('btn-mute');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const btnPick = document.getElementById('btn-pick');
  const fileMusic = document.getElementById('file-music');
  bgm.volume = Math.max(0, Math.min(1, CONFIG.bgmVolume));
  let userMuted = false, songIdx = 0, failedCount = 0, objectURL = null;

  const songName = s => decodeURIComponent(String(s).split('/').pop());
  function playSong(i) {
    const list = CONFIG.playlist || [];
    if (!list.length) return;
    songIdx = ((i % list.length) + list.length) % list.length;
    bgm.src = list[songIdx];
    btnNext.title = '下一首（正在播：' + songName(list[songIdx]) + '）';
    const p = bgm.play();
    if (p && p.catch) p.catch(() => {});
  }
  bgm.addEventListener('playing', () => { failedCount = 0; });
  bgm.addEventListener('ended', () => playSong(songIdx + 1));
  bgm.addEventListener('error', () => {
    const list = CONFIG.playlist || [];
    failedCount++;
    if (list.length && failedCount < list.length) playSong(songIdx + 1);
  });
  btnMute.addEventListener('click', () => {
    userMuted = !userMuted;
    bgm.muted = userMuted;
    btnMute.textContent = userMuted ? '🔇' : '🔊';
    if (!userMuted && bgm.src && bgm.paused) {
      const p = bgm.play();
      if (p && p.catch) p.catch(() => {});
    }
  });
  btnNext.addEventListener('click', () => playSong(songIdx + 1));
  btnPrev.addEventListener('click', () => playSong(songIdx - 1));
  btnPick.addEventListener('click', () => fileMusic.click());
  fileMusic.addEventListener('change', () => {
    const f = fileMusic.files && fileMusic.files[0];
    if (!f) return;
    if (objectURL) URL.revokeObjectURL(objectURL);
    objectURL = URL.createObjectURL(f);
    bgm.src = objectURL;
    userMuted = false; bgm.muted = false;
    btnMute.textContent = '🔊';
    const p = bgm.play();
    if (p && p.catch) p.catch(() => {});
  });

  // ---------- 发光粒子贴图 ----------
  function makeSprite(r, g, b) {
    const s = 64, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const g2 = cv.getContext('2d');
    const grad = g2.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    grad.addColorStop(0,    'rgba(255,255,255,1)');
    grad.addColorStop(0.18, 'rgba(' + r + ',' + g + ',' + b + ',0.95)');
    grad.addColorStop(0.45, 'rgba(' + r + ',' + g + ',' + b + ',0.30)');
    grad.addColorStop(1,    'rgba(' + r + ',' + g + ',' + b + ',0)');
    g2.fillStyle = grad;
    g2.fillRect(0, 0, s, s);
    return cv;
  }
  const h = CONFIG.heartHue;
  const SPR = {
    heart1: makeSprite(255, 70, 130),
    heart2: makeSprite(255, 120, 175),
    heart3: makeSprite(255, 180, 215),
    white:  makeSprite(255, 250, 245),
    gold:   makeSprite(255, 205, 110),
    warm:   makeSprite(255, 150, 80),
    star:   makeSprite(220, 230, 255)
  };

  // ---------- 爱心参数方程 ----------
  function heartPoint(t) {
    return {
      x: 16 * Math.pow(Math.sin(t), 3),
      y: -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))
    };
  }

  // ---------- 静态夜空（渐变 + 星星）生成成一张图，交给 body 背景 ----------
  // 这样每帧不再有全屏背景渐变和全屏星空贴图，手机上省下两次全屏 GPU 绘制
  let stars = [];
  function buildBackground() {
    const q = Q();
    stars = [];
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');

    // 夜空底色
    const base = g.createLinearGradient(0, 0, 0, H);
    base.addColorStop(0, '#080a18');
    base.addColorStop(.6, '#060812');
    base.addColorStop(1, '#04060f');
    g.fillStyle = base;
    g.fillRect(0, 0, W, H);

    // 中央微微的紫调光
    const amb = g.createRadialGradient(CX, H*.4, 0, CX, H*.4, Math.max(W,H)*.75);
    amb.addColorStop(0, 'rgba(36,28,66,.35)');
    amb.addColorStop(1, 'rgba(36,28,66,0)');
    g.fillStyle = amb;
    g.fillRect(0, 0, W, H);

    // 星星（静态，桌面端还会叠加一层缓慢闪烁）
    const n = Math.round(W * H / q.starDiv);
    for (let i = 0; i < n; i++) {
      const st = {
        x: Math.random() * W, y: Math.random() * H,
        s: .4 + Math.random() * 1.0,
        ph: Math.random() * Math.PI * 2,
        sp: .3 + Math.random() * 1.4
      };
      stars.push(st);
      g.globalAlpha = .18 + .5 * Math.random();
      const r = st.s * 2.2;
      g.drawImage(SPR.star, st.x - r, st.y - r, r*2, r*2);
    }
    g.globalAlpha = 1;

    document.body.style.backgroundImage = 'url(' + cv.toDataURL('image/jpeg', .82) + ')';
  }

  // ---------- 离屏缓存：月亮 + 玉兔（普通贴图，正常混合，避免叠加导致的过曝白斑） ----------
  let moonLayer = null, moonX = 0, moonY = 0;
  function buildMoon() {
    const r = Math.min(W, H) * (entered ? .13 : .16);
    moonX = W * (entered ? .80 : .50);
    moonY = H * (entered ? .17 : .30);
    const size = Math.ceil(r * 5.2);
    moonLayer = document.createElement('canvas');
    moonLayer.width = moonLayer.height = size;
    const g = moonLayer.getContext('2d');
    const x = size/2, y = size/2;

    // 月晕
    const halo = g.createRadialGradient(x, y, r*.6, x, y, r*2.6);
    halo.addColorStop(0, 'rgba(255,242,210,.40)');
    halo.addColorStop(.5, 'rgba(255,232,190,.10)');
    halo.addColorStop(1, 'rgba(255,232,190,0)');
    g.fillStyle = halo;
    g.beginPath(); g.arc(x, y, r*2.6, 0, Math.PI*2); g.fill();

    // 月盘
    const disc = g.createRadialGradient(x - r*.28, y - r*.3, r*.1, x, y, r);
    disc.addColorStop(0, '#fffef6');
    disc.addColorStop(.65, '#f8f0d2');
    disc.addColorStop(1, '#e8dcb4');
    g.fillStyle = disc;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();

    // 环形山阴影
    g.fillStyle = 'rgba(190,178,135,.18)';
    [[-.30,.18,.16],[.22,-.22,.11],[.32,.24,.08],[-.06,-.4,.07],[-.38,-.18,.06]].forEach(([dx,dy,rr]) => {
      g.beginPath(); g.arc(x + dx*r, y + dy*r, rr*r, 0, Math.PI*2); g.fill();
    });

    // 玉兔剪影
    g.save();
    g.translate(x + r*.05, y + r*.32);
    g.scale(r/100, r/100);
    g.fillStyle = 'rgba(150,140,105,.35)';
    g.beginPath(); g.ellipse(0, 6, 26, 20, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(-18, -14, 14, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(-24, -34, 5, 17, .18, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(-13, -35, 5, 18, -.10, 0, Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,250,235,.5)';
    g.beginPath(); g.arc(24, 12, 6, 0, Math.PI*2); g.fill();
    g.restore();
  }

  // ---------- 离屏缓存：桂花贴图（替代每帧 7 个路径 + save/rotate/restore） ----------
  function makePetalSprite(tone) {
    const s = 64, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const g = cv.getContext('2d');
    const sz = 7;
    g.translate(s/2, s/2);
    g.fillStyle = 'rgba(255,202,96,.22)';
    g.beginPath(); g.arc(0, 0, sz*2.3, 0, Math.PI*2); g.fill();
    g.fillStyle = tone < .5 ? '#ffd76a' : '#f6b73f';
    for (let k = 0; k < 4; k++) {
      const a = k*Math.PI/2;
      g.beginPath();
      g.ellipse(Math.cos(a)*sz*.55, Math.sin(a)*sz*.55, sz*.52, sz*.34, a, 0, Math.PI*2);
      g.fill();
    }
    g.fillStyle = '#e8862e';
    g.beginPath(); g.arc(0, 0, sz*.27, 0, Math.PI*2); g.fill();
    return cv;
  }
  const PETAL_SPR = [makePetalSprite(0), makePetalSprite(1)];

  // ---------- 离屏缓存：孔明灯贴图（暖光 + 灯身一次画好） ----------
  function makeLampSprite() {
    const s = 64, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const g = cv.getContext('2d');
    g.drawImage(SPR.warm, 4, 4, 56, 56);
    g.fillStyle = '#ffd089';
    g.globalAlpha = .68;
    g.beginPath();
    g.moveTo(32, 18); g.lineTo(42, 32); g.lineTo(32, 48); g.lineTo(22, 32);
    g.closePath(); g.fill();
    g.globalAlpha = 1;
    return cv;
  }
  const LAMP_SPR = makeLampSprite();

  // ---------- 离屏缓存：爱心柔光 ----------
  let glowLayer = null;
  function buildGlow() {
    const gr = S * 22 * 1.09 * Q().glowScale;
    const size = Math.ceil(gr * 2);
    glowLayer = document.createElement('canvas');
    glowLayer.width = glowLayer.height = size;
    const g = glowLayer.getContext('2d');
    const gg = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, gr);
    gg.addColorStop(0, 'hsla(' + h + ',100%,65%,.12)');
    gg.addColorStop(.6, 'hsla(' + h + ',100%,60%,.04)');
    gg.addColorStop(1, 'hsla(' + h + ',100%,60%,0)');
    g.fillStyle = gg;
    g.fillRect(0, 0, size, size);
  }

  // ---------- 爱心粒子 ----------
  let heartParts = [];
  function buildHeart() {
    const q = Q();
    heartParts = [];
    const spread = isMobile ? 420 : 700;
    const add = (bx, by, edge) => {
      const roll = Math.random();
      let sprite, size, alpha;
      if (edge) {
        sprite = roll < .16 ? SPR.white : roll < .55 ? SPR.heart1 : roll < .85 ? SPR.heart2 : SPR.heart3;
        size = 1.0 + Math.random() * 1.6;
        alpha = .85 + Math.random() * .15;
      } else {
        sprite = roll < .07 ? SPR.white : roll < .6 ? SPR.heart1 : SPR.heart2;
        size = .5 + Math.random() * 1.1;
        alpha = .20 + Math.random() * .38;
      }
      heartParts.push({
        bx, by,
        x: bx + (Math.random()-.5) * spread / S,   // 入场时从四周飞来
        y: by + (Math.random()-.5) * spread / S,
        vx: 0, vy: 0,
        size, alpha, sprite,
        tw: Math.random() * Math.PI * 2,
        twSp: .6 + Math.random() * 2.2,
        drift: Math.random() * Math.PI * 2
      });
    };
    for (let i = 0; i < q.edge; i++) {
      const t = Math.random() * Math.PI * 2, p = heartPoint(t);
      add(p.x + (Math.random()-.5)*.5, p.y + (Math.random()-.5)*.5, true);
    }
    for (let i = 0; i < q.fill; i++) {
      const t = Math.random() * Math.PI * 2;
      const r = Math.pow(Math.random(), .55), p = heartPoint(t);
      add(p.x * r, p.y * r, false);
    }
  }
  // 运行时降档：直接截断数组（edge 粒子在前），无重新飞入的突兀感
  function shrinkHeart() {
    const max = Q().edge + Q().fill;
    if (heartParts.length > max) heartParts.length = max;
  }

  // ---------- 桂花 ----------
  const petals = [];
  function resetPetal(p, anywhere) {
    p.x = Math.random() * W;
    p.y = anywhere ? Math.random() * H : -24;
    p.vy = 16 + Math.random() * 32;
    p.sway = Math.random() * Math.PI * 2;
    p.swaySp = .7 + Math.random() * 1.3;
    p.swayAmp = 16 + Math.random() * 38;
    p.size = 2.4 + Math.random() * 3.0;
    p.alpha = .45 + Math.random() * .5;
    p.spr = PETAL_SPR[Math.random() < .5 ? 0 : 1];
  }
  function buildPetals() {
    petals.length = 0;
    const n = Math.round(CONFIG.osmanthusCount * Q().petalMul);
    for (let i = 0; i < n; i++) {
      const p = {};
      resetPetal(p, true);
      petals.push(p);
    }
  }
  function drawPetals(dt) {
    for (const p of petals) {
      p.y += p.vy * dt;
      p.sway += p.swaySp * dt;
      if (p.y > H + 24) resetPetal(p, false);
      const d = p.size * 2.4;
      ctx.globalAlpha = p.alpha;
      ctx.drawImage(p.spr, p.x + Math.sin(p.sway)*p.swayAmp - d/2, p.y - d/2, d, d);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- 孔明灯 ----------
  const lanterns = [];
  function spawnLantern(anyY) {
    lanterns.push({
      x: Math.random() * W,
      y: anyY ? Math.random() * H : H + 40,
      vy: -(14 + Math.random() * 20),
      size: 3.2 + Math.random() * 3.2,
      sway: Math.random() * Math.PI * 2,
      swaySp: .6 + Math.random() * .8
    });
  }

  // ---------- 烟花 ----------
  const fw = [];
  const FW_HUES = [0, 25, 45, 190, 210, 280, 320, 345];
  function firework(x, y, hue) {
    const q = Q();
    if (fw.length > q.fwCap) return;             // 烟花粒子总量上限，防止连点/低端机堆积
    hue = hue === undefined ? FW_HUES[Math.floor(Math.random() * FW_HUES.length)] : hue;
    const n = q.fwMin + Math.floor(Math.random() * (q.fwMax - q.fwMin));
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 220;
      const ph = hue + (Math.random() * 30 - 15);
      fw.push({
        x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, max: 1.1 + Math.random() * 1.0,
        size: 1.2 + Math.random() * 2.0,
        color: 'hsl(' + ph + ',100%,72%)'
      });
    }
  }
  // 爱心形小烟花（点击时绽放）
  function heartFirework(x, y) {
    const q = Q();
    if (fw.length > q.fwCap) return;
    const fhue = h + Math.random() * 20 - 10;
    const color = 'hsl(' + fhue + ',100%,72%)';
    for (let i = 0; i < q.hfw; i++) {
      const t = (i / q.hfw) * Math.PI * 2;
      const p = heartPoint(t);
      fw.push({
        x, y,
        vx: p.x * 13, vy: p.y * 13,
        life: 0, max: 1.3 + Math.random() * .5,
        size: 1.6 + Math.random() * 1.6,
        color
      });
    }
  }

  // ---------- 尺寸 ----------
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    const q = Q();
    const dpr = Math.min(window.devicePixelRatio || 1, q.dprCap) * q.scale;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    CX = W / 2;
    CY = H * (isMobile && W < H ? .36 : .42);
    S = Math.min(W, H) / (isMobile ? 38 : 40);
    buildBackground();
    buildMoon();
    buildGlow();
  }
  let resizeTimer = null;
  function debouncedResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  }
  window.addEventListener('resize', debouncedResize);
  window.addEventListener('orientationchange', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 300);
  });
  resize();
  buildPetals();

  // 初始飘几盏灯
  for (let i = 0; i < (tier === 0 ? 5 : 2); i++) spawnLantern(true);

  // ---------- 交互（手机端不做 hover 斥力，只有点按烟花） ----------
  if (!isMobile) {
    window.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });
  }
  window.addEventListener('pointerdown', e => {
    if (!entered) return;
    if (Math.random() < .5) heartFirework(e.clientX, e.clientY);
    else firework(e.clientX, e.clientY);
  });

  document.getElementById('enter-btn').addEventListener('click', () => {
    entered = true;
    document.getElementById('intro').classList.add('hide');
    musicBar.classList.add('show');
    playSong(0);            // 用户点击手势内启动，浏览器允许播放
    resize();
    buildHeart();
    // 开场烟花
    setTimeout(() => firework(W*.3, H*.28, 345), 300);
    setTimeout(() => firework(W*.7, H*.22, 45), 700);
    setTimeout(() => firework(W*.5, H*.16, 200), 1100);
    // 逐句表白
    const ps = linesBox.querySelectorAll('p');
    ps.forEach((p, i) => setTimeout(() => p.classList.add('show'), 1500 + i * 2200));
    setTimeout(() => document.getElementById('tap-hint').classList.add('show'), 2400);
    setTimeout(() => document.getElementById('tap-hint').classList.remove('show'), 9000);
  });

  // 切后台再回来时避免时间跳变
  document.addEventListener('visibilitychange', () => { lastRender = performance.now(); });

  // ---------- 心跳节奏 ----------
  function beat(t) {
    const P = 1.05, u = (t % P) / P;
    const lub = Math.exp(-Math.pow((u-.10)/.06, 2));
    const dub = .55 * Math.exp(-Math.pow((u-.30)/.07, 2));
    return 1 + (lub + dub) * .09;
  }

  // ---------- 运行时帧率监测：持续低于 ~40fps 自动降一档（只降一次） ----------
  let fpsAccum = 0, fpsFrames = 0, fpsCheckAt = 0, downgraded = false;

  // ---------- 主循环（低档锁 30fps） ----------
  let lastRender = performance.now();
  let time = 0, fwTimer = 2, lanternTimer = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    const q = Q();

    // 低档帧率闸门：不到 30fps 间隔直接跳过本次渲染
    if (q.fpsCap && now - lastRender < 1000 / q.fpsCap - 1) return;

    let dt = (now - lastRender) / 1000;
    lastRender = now;
    if (dt > .05) dt = .05;
    time += dt;

    // 帧率采样（进入爱心宇宙 4 秒后开始，取 3 秒平均值）
    if (entered && tier < 2 && !downgraded) {
      fpsCheckAt += dt;
      if (fpsCheckAt > 4) {
        fpsAccum += dt; fpsFrames++;
        if (fpsAccum >= 3) {
          const avgMs = fpsAccum / fpsFrames * 1000;   // 平均每帧毫秒
          if (avgMs > 25) {                             // 约低于 40fps
            tier++;
            downgraded = true;
            shrinkHeart();
            buildPetals();
            resize();                                   // 按新档重建背景/缓存与画布分辨率
          } else {
            downgraded = true;                          // 性能够用，不再检测
          }
        }
      }
    }

    // 拖影：destination-in 把上一帧整体压向透明（每帧唯一的全屏操作），
    // 静态夜空由 CSS 背景透出，不再需要每帧画底色/渐变/星空
    const retain = entered ? .76 : .66;                 // 单帧保留率（60fps 基准）
    const fade = Math.pow(retain, dt * 60);             // 帧率无关：30fps 时压得更狠，拖影长度一致
    ctx.globalCompositeOperation = 'destination-in';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,' + Math.max(0, Math.min(1, fade)) + ')';
    ctx.fillRect(0, 0, W, H);

    // 月亮：普通混合（以前叠加混合会过曝成一大块白斑）
    ctx.globalCompositeOperation = 'source-over';
    if (moonLayer) ctx.drawImage(moonLayer, moonX - moonLayer.width/2, moonY - moonLayer.height/2);

    // 以下发光元素用叠加混合
    ctx.globalCompositeOperation = 'lighter';

    // 桌面端星星仍保留缓慢闪烁（手机端星星已在 CSS 背景里）
    if (!isMobile) {
      for (const st of stars) {
        ctx.globalAlpha = .12 + .45 * Math.abs(Math.sin(time * st.sp + st.ph));
        const r = st.s * 2.2;
        ctx.drawImage(SPR.star, st.x - r, st.y - r, r*2, r*2);
      }
    }

    // 孔明灯（贴图 + 透明度闪烁）
    lanternTimer += dt;
    if (lanternTimer > (entered ? 1.6 : 2.6) && lanterns.length < q.maxLamp) {
      lanternTimer = 0;
      spawnLantern(false);
    }
    for (let i = lanterns.length - 1; i >= 0; i--) {
      const L = lanterns[i];
      L.y += L.vy * dt;
      L.sway += L.swaySp * dt;
      L.x += Math.sin(L.sway) * 12 * dt;
      if (L.y < -60) { lanterns.splice(i, 1); continue; }
      const flick = .75 + .25 * Math.sin(time * 9 + L.sway * 3);
      const d = L.size * 2.6 * flick;
      ctx.globalAlpha = flick;
      ctx.drawImage(LAMP_SPR, L.x - d/2, L.y - d/2, d, d);
    }
    ctx.globalAlpha = 1;

    // 桂花飘落（贴图，两幕都有）
    drawPetals(dt);

    // 自动烟花 + 点击烟花
    if (entered) {
      fwTimer -= dt;
      if (fwTimer <= 0) {
        fwTimer = q.fwAutoMin + Math.random() * (q.fwAutoMax - q.fwAutoMin);
        firework(W * (.15 + Math.random()*.7), H * (.08 + Math.random()*.30));
      }
    }
    for (let i = fw.length - 1; i >= 0; i--) {
      const p = fw[i];
      p.life += dt;
      if (p.life >= p.max) { fw.splice(i, 1); continue; }
      p.vy += 60 * dt;
      const drag = Math.exp(-.8 * dt);
      p.vx *= drag; p.vy *= drag;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const k = 1 - p.life / p.max;
      const r = p.size * 2.2 * k;
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.1, r*.45), 0, Math.PI*2); ctx.fill();
      ctx.drawImage(SPR.white, p.x - r, p.y - r, r*2, r*2);
    }
    ctx.globalAlpha = 1;

    // 爱心宇宙
    if (entered && heartParts.length) {
      const pulse = beat(time);
      const sc = S * pulse;

      // 柔光贴图（固定一张，靠 alpha 轻微模拟呼吸）
      if (glowLayer) {
        ctx.globalAlpha = .8 + .15 * pulse;
        const gs = glowLayer.width;
        ctx.drawImage(glowLayer, CX - gs/2, CY - gs/2);
        ctx.globalAlpha = 1;
      }

      const damp = Math.exp(-6 * dt);
      for (const p of heartParts) {
        // 弹簧回归（低档关闭漂浮扰动，省三角函数）
        const tx = q.wobble ? p.bx + Math.sin(time*.8 + p.drift)*.12 : p.bx;
        const ty = q.wobble ? p.by + Math.cos(time*.7 + p.drift)*.12 : p.by;
        p.vx += (tx - p.x) * 24 * dt;
        p.vy += (ty - p.y) * 24 * dt;

        // 桌面端鼠标斥力（手机端整段跳过）
        if (mouse.x > -9000) {
          const px = CX + p.x * sc, py = CY + p.y * sc;
          const mdx = px - mouse.x, mdy = py - mouse.y;
          const md2 = mdx*mdx + mdy*mdy;
          if (md2 < 14400) {
            const md = Math.sqrt(md2) || .01;
            const f = (1 - md/120) * 1400;
            p.vx += (mdx/md) * f * dt / sc;
            p.vy += (mdy/md) * f * dt / sc;
          }
        }
        p.vx *= damp; p.vy *= damp;
        const v2 = p.vx*p.vx + p.vy*p.vy;
        if (v2 > 1156) { const v = Math.sqrt(v2); p.vx *= 34/v; p.vy *= 34/v; }
        p.x += p.vx * dt; p.y += p.vy * dt;

        const sx = CX + p.x * sc, sy = CY + p.y * sc;
        // 低档不闪烁（省每粒子 sin），中高档闪烁
        const tw = q.twinkle ? .6 + .4*Math.sin(time * p.twSp + p.tw) : 1;
        const r = p.size * 2.6 * (.9 + .1*pulse);
        ctx.globalAlpha = p.alpha * tw;
        ctx.drawImage(p.sprite, sx - r, sy - r, r*2, r*2);
      }
      ctx.globalAlpha = 1;

      // 金色星尘缓缓飘落（低档关闭）
      if (q.dust && Math.random() < dt * q.dust) {
        const p = heartParts[Math.floor(Math.random() * heartParts.length)];
        fw.push({
          x: CX + p.bx * sc, y: CY + p.by * sc,
          vx: (Math.random()-.5)*14, vy: 12 + Math.random()*18,
          life: 0, max: 1.6 + Math.random(),
          size: .8 + Math.random(),
          color: 'hsl(45,100%,72%)'
        });
      }
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
